name: enterprise-ai-studio-dev
services:
  metadata-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai_studio}
      POSTGRES_USER: ${POSTGRES_USER:-eas_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [metadata-data:/var/lib/postgresql]
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
  redis:
    image: redis:7.4
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run pnpm env:init first}
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?Run pnpm env:init first}", --appendonly, "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    networks: [control]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
  test-source-db:
    image: postgres:18
    profiles: [test-source]
    environment:
      POSTGRES_DB: business_test
      POSTGRES_USER: test_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init first}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [test-source-data:/var/lib/postgresql]
    networks: [test-data]
    security_opt: [no-new-privileges:true]
  platform-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    profiles: [platform]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
    ports: ["127.0.0.1:3000:3000"]
    networks: [control]
    read_only: true
    tmpfs: [/tmp:size=64m,noexec,nosuid]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  control:
    internal: true
  test-data:
    internal: true
volumes:
  metadata-data:
  redis-data:
  test-source-data:
